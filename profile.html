<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль | FS "Тускул"</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/profile.css"> <!-- Отдельный файл стилей для профиля -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- шапка -->
    <header class="site-header">
        <div class="container header-content">
            <a href="index.html" class="logo-area">
                <img src="images/logo/logo.png" alt="Logo" class="logo-img">
                <div class="logo-text"><h1>FS "Тускул"</h1></div>
            </a>
            <nav class="main-nav">
                <a href="index.html">На главную</a>
            </nav>
        </div>
    </header>

    <main class="container section-padding">
        
        <!-- вход/регистрация -->
        <section id="auth-section" class="auth-container">
            <div class="auth-card">
                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">Вход</button>
                    <button class="tab-btn" data-tab="register">Регистрация</button>
                </div>

                <!-- вход -->
                <form id="login-form" class="auth-form active-form">
                    <h2>С возвращением!</h2>
                    <div class="form-group">
                        <label>Email или Логин</label>
                        <input type="text" placeholder="school_student@mail.ru" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary full-width">Войти в аккаунт</button>
                </form>

                <!-- регистрация -->
                <form id="register-form" class="auth-form">
                    <h2>Стань продавцом!</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Имя и Фамилия</label>
                            <input type="text" id="reg-name" placeholder="Иван Иванов" required>
                        </div>
                        <div class="form-group">
                            <label>Школа / Центр</label>
                            <input type="text" id="reg-school" placeholder="СОШ имени Школы'" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reg-email" placeholder="school_student@mail.ru" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="reg-pass" required>
                    </div>
                    <div class="form-group">
                        <label>Основные навыки</label>
                        <select id="reg-skills">
                            <option value="3d_print">3D Печать</option>
                            <option value="robotics">Робототехника</option>
                            <option value="woodwork">Дерево</option>
                            <option value="coding">Программирование</option>
                        </select>
                    </div>
                                        <div class="form-group">
                        <label>Контакты (необязательно)</label>
                        <input type="email" id="reg-email-contact" placeholder="Email для связи">
                        <input type="tel" id="reg-phone" placeholder="Телефон" style="margin-top:10px;">
                        <input type="text" id="reg-telegram" placeholder="Telegram (@username)" style="margin-top:10px;">
                    </div>
                    <button type="submit" class="btn btn-primary full-width">Создать аккаунт</button>
                </form>
            </div>
        </section>

        <!-- когда профиль -->
        <section id="dashboard-section" class="dashboard-container hidden">
            
            <!-- профиль -->
            <div class="profile-header">
                <div class="avatar-placeholder">👤</div>
                <div class="user-info">
                    <h2 id="dash-name">Имя Пользователя</h2>
                    <p class="user-school" id="dash-school">🏫 Школа / Центр</p>
                    <div class="user-skills" id="dash-skills">
                        <!-- навыки через джаваскрипт тут -->
                    </div>
                </div>
                <button id="logout-btn" class="btn btn-outline">Выйти</button>
            </div>

            <!-- статистика -->
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-num">0</span>
                    <span class="stat-label">Моих товаров</span>
                </div>
                <div class="stat-card">
                    <span class="stat-num">0 </span>₽
                    <span class="stat-label">Заработано</span>
                </div>
                <div class="stat-card">
                    <span class="stat-num">0</span>
                    <span class="stat-label">Продаж</span>
                </div>
            </div>

            <!-- товары -->
            <div class="my-products-section">
                <div class="section-header">
                    <h3>Мои работы</h3>
                    <a href="upload.html" class="btn btn-secondary">+ Добавить модель</a>
                </div>
                
                <div id="my-products-grid" class="products-grid">
                    <!-- тут через JavaScript товары сделать потом -->
                    <div class="empty-state">У вас пока нет загруженных работ. Начните продавать свои умения!</div>
                </div>
            </div>

        </section>

    </main>

    <script src="js/main.js"></script> <!-- логика из основы -->
    <script src="js/profile.js"></script> <!-- логика для профиля -->
</body>
</html>
